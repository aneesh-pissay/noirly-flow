<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Offline · Noirly Flow</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0B0C; color: #EDEAE2;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 26rem; text-align: center; }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { font-size: 1.4rem; margin: 16px 0 8px; }
    p { color: #A8A396; margin: 0 0 16px; }
    a { color: #C9A44A; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>This page hasn't been opened on this device yet, so there's no saved copy. Pages you've opened before still work offline, read-only.</p>
    <p><a href="/inbox">Try your Inbox</a> · <a href="">Retry</a></p>
  </main>
</body>
</html>
